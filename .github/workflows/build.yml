# Builds TrayVitals on GitHub's own machines, straight from the code in this repo.
#  - Every change to main: builds it and keeps the files under the run's "Artifacts".
#  - Every published release: builds that release's tag, signs a build attestation
#    (proof the file came from this repo and this workflow), and attaches
#    TrayVitals-Setup.exe and its checksum to the release.
#  - TrayVitals was called TraySense before 1.10.0. Releases 1.10.0 to 1.11.1 also carried the installer as
#    TraySense-Setup.exe for TraySense 1.9.0's updater; from 1.11.2 on they don't. TrayVitals-Setup.exe
#    still moves an old TraySense install over to TrayVitals when it's run by hand.
#  - TrayVitals-update.bin is the bare program (TrayVitals.exe). TrayVitals 1.11.0 and later download
#    just that to update themselves in a few seconds; it isn't meant to be downloaded by hand.
name: build
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write        # attach the files to the release
      id-token: write        # build attestation
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Release tag matches src/version.h
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          v=$(sed -n 's/^#define TV_VERSION_A "\(.*\)".*/\1/p' src/version.h)
          echo "tag $TAG, version $v"
          [ "$TAG" = "v$v" ] || { echo "::error::Release tag $TAG doesn't match version $v in src/version.h"; exit 1; }

      - name: Install the compiler (MinGW-w64 GCC, from the MSYS2 that GitHub's Windows machines have)
        shell: pwsh
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-x86_64-gcc"

      - name: Build
        run: |
          export PATH="/c/msys64/mingw64/bin:$PATH"
          gcc --version
          CC=gcc WINDRES=windres sh build.sh   # the compiler and resource tool installed above
          cp src/TrayVitals/TrayVitals.exe TrayVitals-update.bin   # the bare program, for TrayVitals' in-app update

      - name: Checksums
        run: |
          sha256sum TrayVitals-Setup.exe | tee TrayVitals-Setup.exe.sha256
          sha256sum TrayVitals-update.bin | tee TrayVitals-update.bin.sha256

      - name: Build attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            TrayVitals-Setup.exe
            TrayVitals-update.bin

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TrayVitals
          path: |
            TrayVitals-Setup.exe
            TrayVitals-Setup.exe.sha256

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" TrayVitals-Setup.exe TrayVitals-Setup.exe.sha256 TrayVitals-update.bin TrayVitals-update.bin.sha256 --clobber
